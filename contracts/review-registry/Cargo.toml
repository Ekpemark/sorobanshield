[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.0"

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }

# Build with: cargo build --target wasm32v1-none --release
